name: Refresh Fall 2026 course browser

on:
  workflow_dispatch:
  schedule:
    # 7:15 AM Hawaiʻi Standard Time (UTC-10), every day.
    - cron: "15 17 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Fall 2026 data
        run: timeout 10m python update_fall_2026.py

      - name: Upload diagnostics if refresh fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uh-refresh-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save refreshed snapshot in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html course_browser_fall_2026_current.json

          if git diff --cached --quiet; then
            echo "No course-data changes to commit."
          else
            git commit -m "Update Fall 2026 course availability"
            git push
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
